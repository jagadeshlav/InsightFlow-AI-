# InsightFlow AI - Render Deployment Configuration
services:
  - type: web
    name: insightflow-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
